<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grasse Perfume Oils — Wholesale Catalogue</title>
<link href="fonts.css" rel="stylesheet">
<style>
:root{--bg:#f5f0e8;--panel:#efe7da;--card:#fffdf9;--line:#e3d8c6;--gold:#a8844b;--gold2:#7a5c2e;--txt:#3a3029;--mut:#7f7466;--green:#2bb565}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Tajawal',sans-serif;line-height:1.6;overflow-x:hidden}
body.fa{font-family:'Vazirmatn',sans-serif}
body.en{font-family:'Inter',sans-serif}
.latin{font-family:'Inter',sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:auto;padding:0 20px}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:rgba(245,240,232,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.logo{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:3px;color:var(--gold2);white-space:nowrap}
.logo small{display:block;font-family:'Inter';font-size:9px;letter-spacing:4px;color:var(--mut);margin-top:-6px}
.langs{display:flex;border:1px solid var(--line);border-radius:30px;overflow:hidden}
.langs button{background:none;border:0;color:var(--mut);padding:7px 14px;cursor:pointer;font:600 13px 'Inter','Tajawal','Vazirmatn'}
.langs button.on{background:var(--gold);color:#fff}

/* hero */
.hero{position:relative;padding:90px 0 70px;text-align:center;overflow:hidden;
 background:radial-gradient(ellipse at 50% 0%,rgba(200,165,105,.25),transparent 60%),radial-gradient(ellipse at 15% 90%,rgba(150,175,150,.22),transparent 55%),radial-gradient(ellipse at 85% 80%,rgba(220,180,160,.22),transparent 55%)}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--gold);color:var(--gold2);padding:6px 16px;border-radius:30px;font-size:13px;margin-bottom:22px;animation:fadeUp .8s both}
.flag{display:inline-flex;width:20px;height:13px;border-radius:2px;overflow:hidden}
.flag i{flex:1}.flag i:nth-child(1){background:#0055a4}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#ef4135}
.hero h1{font-size:clamp(30px,5.4vw,60px);font-weight:800;line-height:1.25;animation:fadeUp .8s .1s both}
.shine{background:linear-gradient(100deg,#9a7740 20%,#d9b97c 40%,#9a7740 60%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.hero p.sub{max-width:760px;margin:20px auto 0;color:var(--mut);font-size:clamp(15px,2vw,19px);animation:fadeUp .8s .2s both}
.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px;animation:fadeUp .8s .3s both}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:40px;font-weight:700;font-size:16px;transition:.25s}
.btn.wa{background:var(--green);color:#fff;box-shadow:0 8px 24px rgba(43,181,101,.25)}
.btn.wa:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(37,211,102,.5)}
.btn.gh{border:1px solid var(--gold);color:var(--gold2)}
.btn.gh:hover{background:rgba(168,132,75,.1)}
.btn svg{width:20px;height:20px}

/* bottles art */
.art{display:flex;justify-content:center;align-items:flex-end;gap:26px;margin:50px auto 0;height:170px}
.bottle{position:relative;width:62px;animation:float 5s ease-in-out infinite}
.bottle:nth-child(2){width:84px;animation-delay:-1.5s}.bottle:nth-child(3){animation-delay:-3s}
.bottle .cap{width:40%;height:26px;margin:auto;background:linear-gradient(90deg,#9c7a3c,#f3dca4,#9c7a3c);border-radius:4px 4px 2px 2px}
.bottle .neck{width:24%;height:10px;margin:auto;background:#c9a45a}
.bottle .body{height:105px;border-radius:14px;border:1px solid rgba(243,220,164,.5);background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(222,196,140,.45) 40%,rgba(168,120,60,.6));position:relative;overflow:hidden;box-shadow:0 20px 40px rgba(122,92,46,.15)}
.bottle:nth-child(2) .body{height:135px}
.bottle .body:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);animation:sweep 3.5s infinite}
.drop{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold2);opacity:.6;animation:rise 7s linear infinite}

/* features */
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:-10px;padding-bottom:20px}
.feat{background:var(--card);box-shadow:0 4px 18px rgba(122,92,46,.06);border:1px solid var(--line);border-radius:18px;padding:22px;transition:.3s}
.feat:hover{border-color:var(--gold);transform:translateY(-4px)}
.feat .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(168,132,75,.12);color:var(--gold);margin-bottom:12px}
.feat .ic svg{width:24px;height:24px}
.feat h3{font-size:17px;color:var(--gold2);margin-bottom:4px}
.feat p{color:var(--mut);font-size:14px}

/* alcohol */
.alc{margin:40px 0;border-radius:24px;padding:30px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;
 background:linear-gradient(120deg,rgba(0,85,164,.08),#fffdf9 50%,rgba(239,65,53,.08));border:1px solid var(--line)}
.alc .tag{color:var(--gold);font-size:13px;letter-spacing:1px}
.alc h2{font-size:clamp(22px,3vw,30px);margin:4px 0}
.alc p{color:var(--mut)}
.price-big{text-align:center;background:var(--card);border:1px solid var(--gold);border-radius:18px;padding:16px 26px}
.price-big b{display:block;font:700 38px 'Inter';color:var(--gold2)}
.price-big span{color:var(--mut);font-size:13px}

/* catalogue */
.cat h2.title{text-align:center;font-size:clamp(26px,4vw,40px);margin:30px 0 6px}
.cat p.note{text-align:center;color:var(--mut);margin-bottom:24px;font-size:14px}
.tools{position:sticky;top:62px;z-index:40;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:15px 50px;font:inherit;font-size:16px;outline:none;transition:.2s}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(168,132,75,.15)}
.search svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:16px;width:20px;color:var(--gold)}
.tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--mut);padding:9px 16px;border-radius:30px;cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.tabs button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.tabs .n{opacity:.7;font-size:12px;margin-inline-start:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}

.sec-h{display:flex;align-items:center;gap:12px;margin:34px 0 14px}
.sec-h h3{font-size:22px;color:var(--gold2);white-space:nowrap}
.sec-h p{color:var(--mut);font-size:13px}
.sec-h:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
[dir=rtl] .sec-h:after{background:linear-gradient(270deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:.2s;animation:fadeUp .4s both}
.item{box-shadow:0 2px 10px rgba(122,92,46,.05)}.item:hover{border-color:var(--gold);background:#fffaf2}
.item .nm{font:700 15px 'Inter';letter-spacing:.3px;direction:ltr;text-align:start}
[dir=rtl] .item .nm,[dir=rtl] .item .br{text-align:right}
.item .br{font:600 11px 'Inter';color:var(--gold);letter-spacing:1.5px;margin-bottom:2px;direction:ltr}
.tiers{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tier{flex:1;min-width:70px;border-radius:10px;padding:6px 8px;text-align:center;border:1px solid var(--line)}
.tier small{display:block;font-size:10.5px;color:var(--mut);line-height:1.3}
.tier b{font:700 15px 'Inter'}
.tier .kg{font-size:10px;margin-top:-2px}
.tier b em{font-style:normal;font-size:10px;color:var(--mut);margin-inline-start:2px}
.t0{background:#f6ecd8;border-color:#d9c08f}
.t1{background:#eef1f3;border-color:#d8dee3}
.t2{background:#f5ebe3;border-color:#e3d1c2}
.empty{text-align:center;padding:50px 20px;color:var(--mut);display:none}
.empty .btn{margin-top:16px}

.cta{margin:60px 0 30px;text-align:center;padding:44px 24px;border-radius:26px;border:1px solid var(--gold);
 background:radial-gradient(ellipse at top,rgba(200,165,105,.2),transparent 70%),var(--card)}
.cta h2{font-size:clamp(22px,3.5vw,34px)}
.cta p{color:var(--mut);max-width:640px;margin:10px auto 22px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 0 100px;border-top:1px solid var(--line)}
.fab{position:fixed;bottom:22px;inset-inline-end:22px;z-index:60;width:62px;height:62px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 10px 30px rgba(37,211,102,.5);animation:pulse 2.4s infinite}
.fab svg{width:32px;height:32px;color:#fff}
.tier b{color:var(--txt)}.t0 b{color:var(--gold2)}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:200% center}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes sweep{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.7}100%{transform:translateY(-420px);opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}70%{box-shadow:0 0 0 18px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.reveal{opacity:0;transform:translateY(24px);transition:.7s}
.reveal.in{opacity:1;transform:none}
@media(max-width:640px){.alc{grid-template-columns:1fr;text-align:center}.top .logo small{display:none}.hero{padding:60px 0 50px}.art{height:140px}}
@media print{.top,.tools,.fab,.art,.drop{display:none}.reveal{opacity:1;transform:none}}
</style>
</head>

let L='ar', TAB='all';
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('en-US');
function setLang(l){
  L=l; const t=T[l];
  document.documentElement.lang=l; document.documentElement.dir=t.dir;
  document.body.className=l==='ar'?'':l;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  $('#q').placeholder=t.search;
  document.querySelectorAll('[data-wa]').forEach(a=>{a.href=WA;a.target='_blank';a.rel='noopener'});
  render();
}
function card(x){
  const t=T[L], lab=[t.tA,t.tB,t.tC];
  return `<div class="item">${x.b?`<div class="br">${x.b}</div>`:''}<div class="nm">${x.n}</div><div class="tiers">${x.p.map((p,i)=>`<div class="tier t${i}"><small>${lab[i]}</small><b>${fmt(p)}<em>AED</em></b><small class="kg">${t.kg}</small></div>`).join('')}</div></div>`;
}
function render(){
  const t=T[L], q=$('#q').value.trim().toLowerCase();
  const hit=x=>!q||x.n.toLowerCase().includes(q)||x.b.toLowerCase().includes(q);
  const secs=['ar','en','sig'];
  const counts={all:0}; secs.forEach(s=>counts[s]=DATA.filter(x=>x.s===s&&hit(x)).length); counts.all=counts.ar+counts.en+counts.sig;
  $('#tabs').innerHTML=['all',...secs].map(s=>`<button data-s="${s}" class="${TAB===s?'on':''}">${t[s]}<span class="n">${counts[s]}</span></button>`).join('');
  let html='', total=0;
  secs.forEach(s=>{
    if(TAB!=='all'&&TAB!==s) return;
    const items=DATA.filter(x=>x.s===s&&hit(x)); if(!items.length) return;
    total+=items.length;
    html+=`<div class="sec-h"><div><h3>${t[s]}</h3><p>${t[s+'D']}</p></div></div><div class="grid">${items.slice(0,q?999:600).map(card).join('')}</div>`;
  });
  $('#list').innerHTML=html;
  $('#empty').style.display=total?'none':'block';
}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){TAB=b.dataset.s;render();}});
$('#q').addEventListener('input',render);
// floating drops
const hero=$('#hero');for(let i=0;i<14;i++){const d=document.createElement('span');d.className='drop';d.style.left=Math.random()*100+'%';d.style.bottom='-10px';d.style.animationDelay=(-Math.random()*7)+'s';d.style.animationDuration=(5+Math.random()*5)+'s';hero.appendChild(d);}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.reveal').forEach(e=>io.observe(e));
setLang('ar');
</script>
